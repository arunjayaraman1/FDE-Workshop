<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launchpad — Interactive Product Prototype</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   LAUNCHPAD — interactive presentation prototype (dark slate theme)
   ════════════════════════════════════════════════════════════════ */
:root{
  --bg:#020617; --panel:#0f172a; --panel-2:#0b1220; --panel-3:#111c33;
  --line:#1e293b; --line-2:#334155; --line-soft:rgba(30,41,59,.55);
  --text:#f1f5f9; --muted:#94a3b8; --dim:#64748b; --faint:#475569;
  --accent:#f6821f; --accent-hi:#ff9436; --accent-deep:#b85c10;
  --amber:#fbbf24; --sky:#38bdf8; --emerald:#34d399; --red:#f87171;
  --purple:#c4b5fd; --teal:#2dd4bf; --indigo:#a5b4fc;
  --font-sans:'Geist','Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,monospace;
  --sbw:240px; --tw:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:
  radial-gradient(1200px 600px at 70% -10%, rgba(246,130,31,.06), transparent 60%),
  var(--bg);
  color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:rgba(246,130,31,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
h1,h2,h3{letter-spacing:-.01em}
.mono{font-family:var(--font-mono)}

/* ── layout shell ─────────────────────────────────────────────── */
#app{min-height:100vh}
#view{transition:margin .2s}
body.signed #view{margin-left:var(--sbw);padding-left:0}
body.collapsed #view{margin-left:var(--tw)}
#sidebar{position:fixed;inset:0 auto 0 0;width:var(--sbw);background:rgba(2,6,23,.9);
  border-right:1px solid var(--line-soft);display:flex;flex-direction:column;z-index:40;
  transition:width .2s,transform .2s}
body.collapsed #sidebar{width:var(--tw)}
body.collapsed #sidebar .sb-label,body.collapsed #sidebar .sb-brand-txt{opacity:0;pointer-events:none;width:0;display:none}
.tb{position:fixed;inset:0 0 auto 0;height:52px;background:rgba(2,6,23,.85);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft);display:none;align-items:center;gap:10px;padding:0 14px;z-index:45}

/* ── buttons ──────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
  border-radius:8px;font-size:13px;font-weight:600;height:34px;padding:0 13px;white-space:nowrap;
  transition:all .14s;flex-shrink:0;cursor:pointer;background:none;color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#0b0b0b}
.btn.primary:hover{background:var(--accent-hi)}
.btn.primary.wood{color:#fff;background:linear-gradient(90deg,#f6821f,#c06010);box-shadow:0 2px 14px rgba(246,130,31,.35)}
.btn.primary.wood:hover{filter:brightness(1.07)}
.btn.ghost{border-color:var(--line-2);color:var(--muted)}
.btn.ghost:hover{border-color:var(--line-2);color:#fff;background:#1e293b}
.btn.danger{background:#b91c1c;color:#fff}
.btn.danger:hover{background:#dc2626}
.btn.sm{height:28px;font-size:12px;padding:0 9px;border-radius:7px}
.btn.xs{height:24px;font-size:11px;padding:0 7px;border-radius:6px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;
  border:1px solid var(--line-2);background:rgba(15,23,42,.5);color:var(--muted);transition:all .14s;flex-shrink:0}
.icon-btn:hover{color:#fff;border-color:var(--line-2)}
.icon-btn.danger:hover{color:var(--red);border-color:rgba(248,113,113,.4)}
.icon-btn.sm{width:22px;height:22px;border-radius:6px}
.icon-btn.sm .icon{width:12px;height:12px}
.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── sidebar ──────────────────────────────────────────────────── */
.sb-head{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line-soft)}
.sb-logo{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,#f6821f,#b85c10);color:#0b0b0b;font-weight:800;font-size:12px;flex-shrink:0}
.sb-brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:600;font-size:13px}
.sb-nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.navlink{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:9px;color:var(--muted);
  font-size:13px;font-weight:500;transition:all .12s}
.navlink:hover{color:#e2e8f0;background:#0f172a}
.navlink.active{background:#1e293b;color:#fff}
.navlink.active .icon{color:var(--accent)}
.navlink.play .icon{color:var(--accent)}
.sb-foot{padding:8px 10px 12px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:2px}
.collapse-handle{position:absolute;top:50%;right:-13px;transform:translateY(-50%);width:24px;height:48px;
  border:1px solid var(--line-2);background:#1e293b;color:#cbd5e1;border-radius:0 8px 8px 0;cursor:pointer;
  display:grid;place-items:center;transition:all .15s;z-index:41}
.collapse-handle:hover{color:var(--accent-hi);border-color:var(--accent)}
body.collapsed .collapse-handle{right:-13px}
body.collapsed .collapse-handle .icon{transform:scaleX(-1)}

/* ── page scaffolding ─────────────────────────────────────────── */
.page{max-width:1024px;margin:0 auto;padding:40px 24px 80px}
.page.wide{max-width:1200px}
.page-narrow{max-width:768px;margin:0 auto;padding:40px 24px 80px}
.pagehead{margin-bottom:22px}
.pagehead h1{font-size:24px;font-weight:650;margin:0 0 4px}
.pagehead .sub{color:var(--dim);font-size:13.5px}
.pagehead .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}

/* ── cards / panels ───────────────────────────────────────────── */
.card{background:rgba(15,23,42,.55);border:1px solid var(--line-soft);border-radius:12px}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line-soft)}
.card-head .ttl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.card-body{padding:18px}

/* ── pills / badges / chips ───────────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:99px;
  padding:2px 10px;border:1px solid transparent;white-space:nowrap;line-height:1.55}
.pill .dot{width:6px;height:6px;border-radius:99px;flex-shrink:0}
.pill.pulse .dot{animation:pl 1.3s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
.pill.amber{color:#fcd34d;background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.28)}
.pill.sky{color:#7dd3fc;background:rgba(56,189,248,.10);border-color:rgba(56,189,248,.28)}
.pill.emerald{color:#6ee7b7;background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.28)}
.pill.red{color:#fca5a5;background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.28)}
.pill.slate{color:#94a3b8;background:rgba(148,163,184,.08);border-color:rgba(148,163,184,.2)}
.pill.purple{color:#ddd6fe;background:rgba(196,181,253,.10);border-color:rgba(196,181,253,.26)}
.pill.teal{color:#99f6e4;background:rgba(45,212,191,.10);border-color:rgba(45,212,191,.26)}
.pill.indigo{color:#c7d2fe;background:rgba(165,180,252,.10);border-color:rgba(165,180,252,.26)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;border-radius:6px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);background:#111c33}
.chip.c3{color:var(--teal);background:rgba(45,212,191,.08);border-color:rgba(45,212,191,.3)}
.chip.aws{color:var(--purple);background:rgba(196,181,253,.08);border-color:rgba(196,181,253,.3)}
.chip.soon{color:var(--amber);background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3)}
.chip.amber{color:var(--amber)}
.chip.sky{color:var(--sky)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}

/* ── inputs / forms ───────────────────────────────────────────── */
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:#cbd5e1;margin-bottom:6px}
.field .help{display:block;font-size:11px;color:var(--dim);margin-top:5px}
.input{width:100%;padding:8px 12px;font-size:13.5px;color:#e2e8f0;background:#0b1220;
  border:1px solid #1e293b;border-radius:8px;outline:none;transition:border-color .12s,box-shadow .12s}
.input::placeholder{color:#475569}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(246,130,31,.14)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#64748b 50%),linear-gradient(135deg,#64748b 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
input[type=radio]{accent-color:var(--accent)}
.optrow{display:flex;gap:8px}
.opt{flex:1;text-align:center;padding:9px;border:1px solid var(--line);border-radius:8px;color:var(--dim);
  font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;background:transparent}
.opt.on{border-color:var(--accent);background:#1e293b;color:#fff}
.opt:hover{border-color:var(--line-2)}
.toggle{position:relative;width:36px;height:20px;border-radius:99px;border:1px solid var(--line-2);background:#0b1220;transition:all .16s;cursor:pointer;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:99px;background:#64748b;transition:all .16s}
.toggle.on{background:rgba(246,130,31,.25);border-color:var(--accent)}
.toggle.on::after{left:18px;background:var(--accent)}
.errbox{display:flex;align-items:center;gap:8px;border:1px solid rgba(248,113,113,.4);background:rgba(127,29,29,.25);
  color:#fecaca;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}
.okbox{display:flex;align-items:center;gap:8px;border:1px solid rgba(52,211,153,.35);background:rgba(6,78,59,.25);
  color:#a7f3d0;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}
.infobox{display:flex;align-items:center;gap:8px;border:1px solid rgba(56,189,248,.3);background:rgba(12,74,110,.3);
  color:#bae6fd;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}
.amberbox{display:flex;align-items:center;gap:8px;border:1px solid rgba(251,191,36,.35);background:rgba(120,53,15,.3);
  color:#fde68a;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}

/* ── tables ───────────────────────────────────────────────────── */
.tblwrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:12px;background:rgba(15,23,42,.4)}
table.tbl{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
.tbl thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:600;
  padding:11px 16px;border-bottom:1px solid var(--line);background:rgba(15,23,42,.6);white-space:nowrap}
.tbl tbody td{padding:11px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:rgba(15,23,42,.7)}
.iconlink{display:inline-flex;align-items:center;gap:5px;color:var(--muted);transition:color .12s}
.iconlink:hover{color:var(--accent-hi)}
a.accent{color:var(--accent-hi)}
.code{font-family:var(--font-mono);font-size:12px;color:var(--sky)}

/* ── tabs ─────────────────────────────────────────────────────── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line-soft);overflow-x:auto}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--dim);border-bottom:2px solid transparent;
  white-space:nowrap;cursor:pointer;transition:all .12s;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:#cbd5e1}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── modal ────────────────────────────────────────────────────── */
.modal-backdrop{position:fixed;inset:0;z-index:90;background:rgba(2,6,23,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#0b1220;border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
.modal-head h2{font-size:15px;margin:0 0 3px}
.modal-head .sub{font-size:12px;color:var(--dim)}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-soft)}
.modal-foot .grow{flex:1}

/* ── toasts ───────────────────────────────────────────────────── */
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:360px}
.toast{display:flex;gap:10px;align-items:flex-start;background:#101b30;border:1px solid var(--line);
  border-radius:11px;padding:11px 14px;font-size:12.5px;box-shadow:0 12px 40px rgba(0,0,0,.45);animation:slidein .22s ease}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
.toast .t-ico{flex-shrink:0;margin-top:1px}
.toast.ok .t-ico{color:var(--emerald)} .toast.err .t-ico{color:var(--red)}
.toast.info .t-ico{color:var(--sky)} .toast.warn .t-ico{color:var(--amber)}

/* ── stat cards ───────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:rgba(15,23,42,.55);border:1px solid var(--line-soft);border-radius:12px;padding:13px 15px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:rgba(255,255,255,.05)}
.stat .lb{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:5px}
.stat .vl{font-size:13.5px;font-weight:600;color:#e2e8f0}

/* ── hero (project detail) ────────────────────────────────────── */
.hero{background:linear-gradient(160deg,#0d1f3c 0%,#0a1628 45%,#060d1a 100%);border-bottom:1px solid var(--line-soft);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(246,130,31,.08),transparent 70%)}
.avatar{display:grid;place-items:center;width:54px;height:54px;border-radius:15px;font-weight:800;font-size:18px;color:#fff;flex-shrink:0;
  background:linear-gradient(135deg,#f6821f,#9a3e00);box-shadow:0 6px 22px rgba(246,130,31,.35)}

/* ── terminal ─────────────────────────────────────────────────── */
.term{background:#070d1c;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;font-family:var(--font-mono);font-size:11.5px;line-height:1.65}
.term-chrome{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line-soft);background:#0a1122}
.tdots{display:flex;gap:6px}
.tdots span{width:10px;height:10px;border-radius:50%}
.tdots .r{background:rgba(239,68,68,.7)}.tdots .y{background:rgba(245,158,11,.7)}.tdots .g{background:rgba(16,185,129,.7)}
.term-body{padding:12px 16px;max-height:280px;overflow-y:auto;color:#94a3b8}
.term-body .ok{color:#6ee7b7}.term-body .hi{color:var(--accent-hi)}.term-body .dm{color:#475569}
.ll-body{padding:14px 18px;flex:1;overflow-y:auto
;font-family:var(--font-mono);font-size:11.5px;line-height:1.7;max-height:none}
.ll-entry{border-bottom:1px solid rgba(30,41,59,.5);padding-bottom:10px;margin-bottom:10px}
.ll-entry:last-child{border-bottom:none;margin-bottom:0}

/* ── grids ────────────────────────────────────────────────────── */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:34px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
@media(max-width:980px){.split{grid-template-columns:1fr}}
.sticky{position:sticky;top:20px}
.tile{border:1px solid var(--line-soft);border-radius:12px;padding:16px;cursor:pointer;background:rgba(15,23,42,.55);transition:all .14s;display:flex;flex-direction:column}
.tile:hover{border-color:var(--line-2)}
.tile.mini{padding:13px 15px}
.importcard{display:flex;flex-direction:column;gap:8px;border-radius:12px;padding:16px 18px;cursor:pointer;
  border:1px solid rgba(246,130,31,.4);background:rgba(246,130,31,.05);transition:all .14s}
.importcard:hover{border-color:var(--accent)}
.importcard .ttl{font-size:13.5px;font-weight:600}
.importcard .sub{font-size:12px;color:#94a3b8}

/* ── detail rows ──────────────────────────────────────────────── */
.dl{display:flex;justify-content:space-between;gap:16px;padding:8px 0;font-size:13px}
.dl dt{color:var(--dim);flex-shrink:0}
.dl dd{margin:0;text-align:right;color:#cbd5e1;min-width:0;overflow-wrap:anywhere}
.dl dd.mono{font-family:var(--font-mono);font-size:12px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.divide>*+*{border-top:1px solid var(--line-soft)}

/* ── activity timeline ────────────────────────────────────────── */
.timeline{margin-left:6px;padding-left:18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.tl-item{position:relative}
.tl-item::before{content:"";position:absolute;left:-26px;top:0;width:16px;height:16px;border-radius:50%;
  border:1px solid var(--line-2);background:#0b1220;display:grid;place-items:center}
.tl-item .ic{position:absolute;left:-24px;top:1px;width:12px;height:12px;display:grid;place-items:center;font-size:9px}
.tl-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.tl-top .lb{font-size:12.5px;font-weight:600}
.tl-top .who{font-size:11px;color:var(--dim)}
.tl-top time{font-size:11px;color:var(--dim);margin-left:auto}
.tl-detail{font-size:11.5px;color:var(--dim);margin-top:2px}
.c-emerald{color:var(--emerald)}.c-red{color:var(--red)}.c-sky{color:var(--sky)}
.c-amber{color:var(--amber)}.c-purple{color:var(--purple)}.c-slate{color:var(--muted)}

/* ── login ────────────────────────────────────────────────────── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:360px}
.login-badge{margin:0 auto 18px;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#0b0b0b;
  background:linear-gradient(135deg,#f6821f,#b85c10);font-weight:800;font-size:15px}
.demo-hint{margin-top:16px;border:1px dashed var(--line-2);border-radius:9px;padding:9px 12px;font-size:11.5px;color:var(--dim)}

/* ── misc ─────────────────────────────────────────────────────── */
.empty{border:1px dashed var(--line-2);border-radius:12px;padding:40px;text-align:center;color:var(--dim);font-size:13.5px}
.skel{height:14px;border-radius:6px;background:var(--line-soft);animation:pl 1.4s ease-in-out infinite}
.snippet{background:#060d1c;border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;font-family:var(--font-mono);font-size:11px;line-height:1.7;color:#94a3b8;overflow-x:auto;white-space:pre}

/* ── LAUNCH SEQUENCE ───────────────────────────────────────────── */
function launchSequence(){
  var t=W.tpl;
  var lines=[
   [0,'Provisions recipe','Scaffolding project from '+t.name],
   [1,'create github repo',ORG+'/'+W.name+' (private='+W.priv+')'],
   [2,'set deploy secrets','CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID'+(t.provider==='aws'?', AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION':'')],
   [3,'scaffold workflow','.github/workflows/deploy.yml written'],
   [4,'push code','git push origin main — '+W.envs.length+' env var(s), '+W.binds.length+' binding(s)'],
   [5,'trigger deploy','GitHub Actions run #'+Math.floor(100+Math.random()*400)+' started']
  ];
  if(W.binds.length)lines.push([6,'gather resources','KV/D1/R2/AI Search bindings will be created on first deploy']);
  var html='<div class="modal-head"><div><h2>Launching '+esc(W.name)+'</h2><div class="sub">GitHub → Cloudflare via GitHub Actions</div></div>'+
   '<span class="pill sky pulse" id="seqPill"><span class="dot"></span>RUNNING</span></div>'+
   '<div class="modal-body" style="padding:8px 16px"><div class="term">'+
   '<div class="term-chrome"><div class="tdots"><span class="r"></span><span class="y"></span><span class="g"></span></div><span class="mono" style="font-size:10px;letter-spacing:.08em;color:#475569">launchpad · provisioning</span></div>'+
   '<div class="term-body" id="seqLog" style="max-height:300px"></div></div></div>'+
   '<div class="modal-foot"><button class="btn primary wood" id="seqOpen" style="display:none">'+icon('rocket')+' Open project →</button>'+
   '<button class="btn ghost" id="seqClose">Dismiss</button></div>';
  openModal(html);
  var log=$('seqLog'),i=0;
  function tick(){
    if(i>=lines.length){finish();return}
    var L=lines[i];
    var line='<div class="ok">▸ '+L[0]+'</div><div class="dm">  '+esc(L[1])+'</div>';
    log.innerHTML+=line;
    if(i===4&&W.envs.length){W.envs.forEach(function(v){if(v.key.trim())log.innerHTML+='<div class="dm">    env '+esc(v.key)+' ••••••••</div>'})}
    if(i===4&&W.binds.length){W.binds.forEach(function(b){if(b.name.trim())log.innerHTML+='<div class="dm">    bind '+esc(b.name)+' → '+esc(b.resource||b.type)+'</div>'})}
    log.scrollTop=log.scrollHeight;
    i++;setTimeout(tick,i>=3?500:420);
  }
  function finish(){
    log.innerHTML+='<div class="ok">✔ Done — '+esc(W.name)+' is deploying on '+platform(W.tpl)+'</div>';
    log.scrollTop=log.scrollHeight;
    $('seqPill').innerHTML='<span class="dot"></span>SUCCESS';
    $('seqPill').className='pill emerald';
    $('seqOpen').style.display='inline-flex';
  }
  setTimeout(tick,400);
  var st=$('seqOpen');st.onclick=function(){
    var proj={id:'p'+Date.now(),name:W.name,tpl:t,templateName:t.name,type:t.type,provider:t.provider,owner:ORG,repo:W.name,
      createdAt:new Date().toISOString(),status:'running',totalRuns:1,latestRun:99,
      env:W.envs.filter(function(v){return v.key.trim()}).map(function(v){return {key:v.key,kind:v.kind}}),
      binds:W.binds.filter(function(b){return b.name.trim()}).map(function(b){return {type:b.type,name:b.name,resource:b.resource||b.type}}),
      members:[{username:session.username,role:'owner',gh:ORG,ghState:'active'}],invites:[],access:'public',
      url:deriveURL(t,W.name),activity:[],previews:[{branch:'main',on:true}]};
    proj.activity=[{at:'just now',actor:session.username,action:'launch',detail:'Launched via wizard from '+platform(t),project:proj.name}];
    proj.runs=[{runId:99,status:'in_progress',conclusion:null,headSha:'aaaa111',created:'just now',updated:'just now',dur:'—',
      steps:[{name:'Checkout code',s:'in_progress',c:null}],text:'Run #99 for '+proj.name+' started just now.\n\n• Checkout code' }];
    logAudit(session.username,'launch',proj.name,'Launched '+proj.name+' ('+t.id+') on '+platform(t),'ok');
    PROJECTS.unshift(proj);
    closeModal();
    W.name='';W.binds=[];W.envs=[];W.preview=true;W.provision=true;
    toast('Project '+proj.name+' launched','ok');
    go('project',{id:proj.id});
  };
  var dc=$('seqClose');dc.onclick=function(){if(log.innerHTML.indexOf('Done')<0){toast('Launched in background — check Projects','info');closeModal();go('projects')}};
}
function deriveURL(t,name){
  if(t.provider==='aws')return t.type==='amplify'?'https://main.d2x9k1p7jqr6yb.amplifyapp.com':'https://7h29f.execute-api.us-east-1.amazonaws.com/prod';
  return t.type==='pages'?'https://'+name+'.pages.dev':'https://'+name+'.newpage.workers.dev';
}

function groupOf(s){if(s==='running'||s==='queued')return 'running';if(s==='success')return 'success';if(s==='failure')return 'failed';return 'all'}
function dotHTML(s){var m=STATUS_META[s]||STATUS_META.unknown;

function wireProjects(){
  document.querySelectorAll('#view [data-filter]').forEach(function(el){el.onclick=function(){PState.filter=el.dataset.filter;refresh()}});
  var s=$('projSearch');if(s)s.oninput=function(){PState.query=s.value;refresh()};
  var cbAll=$('cbAll');if(cbAll)cbAll.onchange=function(){
    document.querySelectorAll('#view .rowcb').forEach(function(cb){PState.selected[cb.dataset.cb]=cbAll.checked});
    refresh()};
  document.querySelectorAll('#view .rowcb').forEach(function(cb){cb.onchange=function(){PState.selected[cb.dataset.cb]=cb.checked;refresh()}});
  var cs=$('clearSel');if(cs)cs.onclick=function(){PState.selected={};refresh()};
  document.querySelectorAll('#view [data-open-proj]').forEach(function(el){el.onclick=function(){P.tab='overview';go('project',{id:el.dataset.openProj})}});
  document.querySelectorAll('#view [data-logs]').forEach(function(el){el.onclick=function(){var p=projById(el.dataset.logs);showLogsModal(p,0)}});
  document.querySelectorAll('#view [data-del]').forEach(function(el){el.onclick=function(){deleteModal(projById(el.dataset.del))}});
  var bd=$('bulkDel');if(bd)bd.onclick=function(){
    var sel=PROJECTS.filter(function(p){return PState.selected[p.id]});
    bulkDeleteModal(sel);
  };
}
function projById(id){return PROJECTS.find(function(p){return p.id===id})}

/* ── logs modal ────────────────────────────────────────────────── */
function showLogsModal(p,runIdx){
  var run=p.runs[runIdx];
  var steps=run.steps.map(function(s,ix){
    var st='slate';if(s.c==='success')st='emerald';else if(s.s==='in_progress'||s.s==='queued')st='sky';else if(s.c==='failure')st='red';
    return '<div class="flex ai-c jb g8" style="padding:8px 4px;border-bottom:1px solid var(--line-soft)"><span class="mono" style="font-size:12px">'+s.name+'</span>'+
     '<span class="pill '+st+'">'+(s.c||s.s)+'</span></div>'}).join('');
  openModal('<div class="modal-head"><div><h2>Deploy log — run #'+run.runId+'</h2><div class="sub">'+esc(p.owner+'/'+p.repo)+'</div></div>'+
   '<button class="icon-btn" id="lgClose">'+icon('x')+'</button></div>'+
   '<div class="modal-body" style="width:560px;max-width:94vw">'+steps+
   '<div class="snippet mt12" style="max-height:220px;overflow:auto">'+esc(run.text)+'</div></div>'+
   '<div class="modal-foot"><button class="btn ghost" id="lgClose2">Close</button></div>');
  $('lgClose').onclick=closeModal;$('lgClose2').onclick=closeModal;
  document.addEventListener('keydown',escKey);
}
function deleteModal(p){
  openModal('<div class="modal-head"><div><h2>Delete '+esc(p.name)+'?</h2><div class="sub">This removes the project from Launchpad and deletes the resources you select below. This cannot be undone.</div></div>'+
   '<button class="icon-btn" id="dx">'+icon('x')+'</button></div>'+
   '<div class="modal-body" style="width:440px;max-width:94vw">'+
   '<label class="flex ai-c g8 mb12" style="border:1px solid var(--line);background:rgba(15,23,42,.5);border-radius:9px;padding:10px 12px;font-size:13px"><input type="checkbox" id="dRepo" checked>Delete the GitHub repo <code class="mono" style="font-size:11px;color:#94a3b8">'+esc(p.owner+'/'+p.repo)+'</code></label>'+
   '<label class="flex ai-c g8 mb12" style="border:1px solid var(--line);background:rgba(15,23,42,.5);border-radius:9px;padding:10px 12px;font-size:13px"><input type="checkbox" id="dCF" checked>Delete the '+(p.provider==='aws'?(p.type==='amplify'?'AWS Amplify app':'AWS Lambda stack'):'Cloudflare '+(p.type==='pages'?'Pages':'Workers')+' project')+'</label>'+
   '<div class="field mb0"><label>Type <code class="mono">'+esc(p.name)+'</code> to confirm</label>'+
   '<input class="input" id="dConfirm" placeholder="'+esc(p.name)+'"></div>'+
   '<div id="dErr"></div></div>'+
   '<div class="modal-foot"><button class="btn ghost" id="dx2">Cancel</button>'+
   '<button class="btn danger" id="dGo" disabled>Delete</button></div>');
  $('dx').onclick=closeModal;$('dx2').onclick=closeModal;
  $('dGo').onclick=function(){
    var name=$('dConfirm').value.trim();
    if(name!==p.name){$('dErr').innerHTML='<div class="errbox mt8">'+icon('warn')+'Name did not match.</div>';return}
    var ci=PROJECTS.indexOf(p);if(ci>-1){PROJECTS.splice(ci,1)}
    logAudit(session.username,'delete',p.name,'Deleted project and '+(p.provider==='aws'?(p.type==='amplify'?'Amplify app':'Lambda stack'):'Cloudflare project')+' (repo '+(($('dRepo').checked)?'removed':'kept')+')','ok');
    closeModal();toast('Project '+p.name+' deleted','ok');
    if(VIEW.name==='project')go('projects');else refresh();
  };
  $('dConfirm').oninput=function(){$('dGo').disabled=$('dConfirm').value.trim()!==p.name};
  document.addEventListener('keydown',escKey);
}
function bulkDeleteModal(sel){
  var names=sel.map(function(p){return esc(p.name)}).join(', ');
  openModal('<div class="modal-head"><div><h2>Delete '+sel.length+' projects?</h2><div class="sub">'+names+'</div></div>'+
   '<button class="icon-btn" id="bx">'+icon('x')+'</button></div>'+
   '<div class="modal-body" style="width:440px;max-width:94vw"><div class="muted tiny">Each project’s GitHub repo and Cloudflare/AWS resources will be deleted. Type the number of projects to confirm.</div>'+
   '<div class="field mt12 mb0"><label>Type <code class="mono">'+sel.length+'</code> to confirm</label><input class="input" id="bConfirm"></div>'+
   '<div id="bErr"></div></div>'+
   '<div class="modal-foot"><button class="btn ghost" id="bx2">Cancel</button><button class="btn danger" id="bGo" disabled>Delete '+sel.length+' projects</button></div>');
  $('bx').onclick=closeModal;$('bx2').onclick=closeModal;
  $('bGo').onclick=function(){
    if($('bConfirm').value.trim()!==''+sel.length){$('bErr').innerHTML='<div class="errbox mt8">'+icon('warn')+'Number did not match.</div>';return}
    sel.forEach(function(p){var i=PROJECTS.indexOf(p);if(i>-1)PROJECTS.splice(i,1)});
    PState.selected={};
    closeModal();toast(sel.length+' projects deleted','ok');refresh();
  };
  $('bConfirm').oninput=function(){$('bGo').disabled=$('bConfirm').value.trim()!==''+sel.length};
  document.addEventListener('keydown',escKey);
}

  var ev=$('llState');var dot=$('llDot');var txt=$('llTxt');
  if(ev){ev.style.display='flex';dot.className='dot-'+(live.connected?'':'pulse');dot.style.background=live.connected?'#34d399':'#64748b';
    txt.style.color=live.connected?'#34d399':'#64748b';txt.textContent=live.connected?'LISTENING':'CONNECTING…'}
  if(live.streaming)b.scrollTop=b.scrollHeight;
  document.querySelectorAll('.ll-copy').forEach(function(c){c.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText('');toast('Entry copied','ok')}});
  var cl=$('llClear');if(cl)cl.onclick=function(){live.entries=[];renderLive()};
  var rs=$('llResume');if(rs)rs.onclick=function(){live.autoScroll=true;renderLive()};
  var ls=$('llStatus')&&null;
  refreshLiveBar();
}
function refreshLiveBar(){
  var evs=document.querySelector('.live-status .br');/* noop */
}
function wireLive(){
  var p=projById(VIEW.params.id);
  var lb=$('llBack');if(lb)lb.onclick=function(){stopLive();P.tab='overview';go('project',{id:p.id})};
  var br=$('llBranch');if(br)br.onchange=function(){live.branch=br.value};
  function stream(){
    live.streaming=true;live.connected=false;live.entries=[];
    var st=$('llState');if(st){st.style.color='#64748b';$('llTxt').textContent='CONNECTING…';$('llDot').className='dot-pulse';$('llDot').style.background='#64748b'}
    setTimeout(function(){live.connected=true;renderLive()},1200);
    live.timer=setInterval(function(){
      var pick=LOGPOOL[Math.floor(Math.random()*LOGPOOL.length)];
      live.entries.push({id:llSeq++,at:new Date().toLocaleTimeString(),outcome:pick[0],method:pick[1],url:pick[2],level:pick[3]==null?'log':(pick[3].indexOf('cache')>-1?'info':pick[0]==='error'?'error':pick[0]==='warn'?'warn':'log'),msg:pick[3]});
      if(live.entries.length>80)live.entries.shift();
      renderLive();
    },1600);
    renderLive();mbToggle();
  }
  function mbToggle(){
    var goB=$('llGo'),st=$('llStop');
    if(live.streaming){
      if(goB){var s=document.createElement('button');s.id='llStop';s.className='btn';s.style.cssText='border-color:rgba(248,113,113,.5);color:#fca5a5;background:rgba(127,29,29,.3);height:31px';s.innerHTML=icon('stop')+' Stop';goB.parentNode.replaceChild(s,goB);s.onclick=stopStream}
    }else{
      if(st){var g=document.createElement('button');g.id='llGo';g.className='btn primary wood';g.style.cssText='height:31px';g.innerHTML=icon('play')+' Connect';st.parentNode.replaceChild(g,st);g.onclick=stream}
    }
  }
  function stopStream(){stopLive();renderLive();toast('Live log stream stopped','info');mbToggle()}
  var goB=$('llGo');if(goB)goB.onclick=stream;
  var sp=$('llStop');if(sp)sp.onclick=stopStream;
}
function stopLive(){if(live.timer)clearInterval(live.timer);live.timer=null;live.streaming=false;live.connected=false}
